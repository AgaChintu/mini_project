<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClariQ Login</title>

    <link rel="stylesheet" href="../student-css/login.css">
    <link rel="stylesheet" href="../student-css/common.css">
    <script src="../student-js/login.js" defer></script>
</head>

<body>

    <div class="container">

        <!-- LEFT SIDE -->
        <div class="left">

            <div class="left-content">

                <h1 class="hero-title">
                    Ask. Learn.<br />
                    <span class="highlight">Grow.</span>
                </h1>

                <p class="hero-subtitle">
                    AI-powered, identity-protected<br />
                    doubt resolution for a smarter<br />
                    academic journey.
                </p>

                <div class="illustration-container">

                    <img src="../assets/images/login-illustration.png"
                         alt="Illustration"
                         class="hero-img" />

                    <div class="features-row">

                        <div class="feature-item">
                            <div class="feature-icon-circle">
                                <i data-lucide="shield-check"></i>
                            </div>

                            <span class="feature-text">
                                Your doubts,<br>your privacy
                            </span>
                        </div>

                        <div class="feature-divider"></div>

                        <div class="feature-item">
                            <div class="feature-icon-circle">
                                <i data-lucide="user-round"></i>
                            </div>

                            <span class="feature-text">
                                Teacher verified<br>answers
                            </span>
                        </div>

                        <div class="feature-divider"></div>

                        <div class="feature-item">
                            <div class="feature-icon-circle">
                                <i data-lucide="book-open"></i>
                            </div>

                            <span class="feature-text">
                                Better learning,<br>together
                            </span>
                        </div>

                    </div>
                </div>

            </div>
        </div>


        <!-- RIGHT SIDE: LOGIN BOX -->
        <div class="right">

            <div class="login-box">

                <div class="card-header">

                    <img src="../assets/images/clariq-logo.svg"
                         alt="ClariQ Logo"
                         class="logo" />

                    <h2>Welcome Back</h2>

                    <p class="login-subtitle">
                        Log in to your ClariQ account to continue
                    </p>

                </div>


                <!-- LOGIN FORM -->
                <form class="login-form" id="loginForm">

                    <!-- COLLEGE ID -->
                    <div class="form-group">

                        <label for="collegeId">
                            <i data-lucide="user-round"
                               class="input-icon"></i>
                            College ID or Email
                        </label>

                        <input type="text"
                               id="collegeId"
                               name="collegeId"
                               placeholder="Enter your College ID or Email"
                               autocomplete="username"
                               required />

                    </div>


                    <!-- PASSWORD -->
                    <div class="form-group">

                        <label for="password">
                            <i data-lucide="lock-keyhole"
                               class="input-icon"></i>
                            Password
                        </label>

                        <div class="password-wrapper">

                            <input type="password"
                                   id="password"
                                   name="password"
                                   placeholder="Enter your password"
                                   autocomplete="current-password"
                                   required />

                            <button type="button"
                                    class="eye-btn"
                                    id="togglePassword"
                                    aria-label="Show password">

                                <i data-lucide="eye" id="eyeIcon"></i>

                            </button>

                        </div>

                    </div>


                    <!-- LOGIN BUTTON -->
                    <button type="submit" id="loginBtn">

                        <span id="loginBtnText">Login</span>
                        <span>&rarr;</span>

                    </button>

                    <!-- SIGN UP LINK -->
                    <div style="margin-top: 18px; text-align: center; font-size: 14px; color: #64748B;">
                        Don't have an account? 
                        <a href="register.html" style="color: #3B82F6; font-weight: 600; text-decoration: none;">Create Account</a>
                    </div>

                </form>

            </div>
        </div>

    </div>


    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        lucide.createIcons();
    </script>

</body>
</html>
